<!DOCTYPE html>
<html lang="vi">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tailwind CSS CDN -->

    <!-- React & ReactDOM từ CDNJS của Cloudflare cực kỳ ổn định -->

      src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"

      src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
      crossorigin

    <!-- Babel standalone phiên bản mới nhất từ CDNJS -->

      src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.22.20/babel.min.js"

    <!-- Font chữ sang trọng -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Urbanist:wght@600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
      }
      .font-title {
        font-family: "Urbanist", sans-serif;

    </style>
    <!-- Hệ thống tự động phát hiện lỗi và hiển thị bảng chẩn đoán thay vì để màn hình trắng -->
    <script>
      window.addEventListener("error", function (e) {
        const rootEl = document.getElementById("root");
        if (rootEl) {
          rootEl.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center bg-slate-100 p-4 font-sans">
                        <div class="bg-white p-6 rounded-2xl shadow-xl max-w-lg w-full border border-red-200 text-center">
                            <div class="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-8 h-8">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.3c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
                                </svg>
                            </div>
                            <h2 class="text-red-600 font-bold text-xl mb-2 font-title">Không thể khởi động hệ thống</h2>
                            <p class="text-slate-600 text-sm mb-4">Trình duyệt gặp lỗi khi tải ứng dụng tài chính của bạn. Chi tiết kỹ thuật bên dưới:</p>
                            <pre class="bg-red-50 text-red-700 p-3 rounded-lg text-xs overflow-x-auto font-mono text-left mb-4 whitespace-pre-wrap">${
                              e.message ||
                              "Lỗi không xác định hoặc do đường truyền CDN chậm"
                            }</pre>
                            <button onclick="window.location.reload()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-3 px-4 rounded-xl transition-colors shadow-md">
                                Thử tải lại trang
                            </button>
                        </div>
                    </div>
                `;
        }
      });
    </script>
  </head>
  <body class="bg-slate-100 text-slate-800">
    <!-- Giao diện chờ cực đẹp trong lúc React tải ứng dụng -->

      <div
        class="min-h-screen flex items-center justify-center bg-slate-100 font-sans"
      >
        <div
          class="text-center p-8 bg-white rounded-2xl shadow-xl max-w-md w-full mx-4 border border-slate-100"
        >
          <div
            class="animate-spin rounded-full h-12 w-12 border-b-2 border-emerald-500 mx-auto mb-4"
          ></div>
          <h2 class="text-xl font-bold text-slate-700 mb-2 font-title">
            Đang kết nối ví tài chính...
          </h2>
          <p class="text-slate-500 text-sm leading-relaxed">
            Vui lòng chờ trong giây lát để hệ thống khởi động bảng dòng tiền của
            bạn.
          </p>
        </div>
      </div>
    </div>

    <!-- Script React biên dịch an toàn bằng Babel và hỗ trợ ES6 -->

      const { useState, useEffect, useMemo, useRef } = React;

      const IconPiggyBank = () => (

      const IconTrendingDown = ({ size = 28 }) => (

        >

        </svg>
      );
      const IconCalendar = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"

        >
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2" />
          <line x1="16" x2="16" y1="2" y2="6" />
          <line x1="8" x2="8" y1="2" y2="6" />

      );
      const IconInfo = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"

          strokeWidth="2"

        >
          <circle cx="12" cy="12" r="10" />

          <path d="M12 8h.01" />
        </svg>
      );
      const IconBarChart = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <line x1="18" x2="18" y1="20" y2="10" />
          <line x1="12" x2="12" y1="20" y2="4" />
          <line x1="6" x2="6" y1="20" y2="14" />
        </svg>
      );
      const IconArrowLeft = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <line x1="19" x2="5" y1="12" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      );
      const IconDownload = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="7 10 12 15 17 10" />
          <line x1="12" x2="12" y1="15" y2="3" />
        </svg>
      );
      const IconUpload = () => (
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
          <polyline points="17 8 12 3 7 8" />
          <line x1="12" x2="12" y1="3" y2="15" />
        </svg>
      );

      const App = () => {
        // --- TỰ ĐỘNG LẤY THỜI GIAN THỰC CỦA THIẾT BỊ ---
        const [currentDate, setCurrentDate] = useState(new Date());

        // Tải dữ liệu lưu trữ từ trình duyệt của người dùng
        const [transactions, setTransactions] = useState(() => {
          try {
            const savedData = localStorage.getItem("finance_data_pro");
            return savedData ? JSON.parse(savedData) : {};
          } catch (e) {
            return {};
          }
        });

        const [isModalOpen, setIsModalOpen] = useState(false);
        const [selectedDateKey, setSelectedDateKey] = useState(null);
        const [viewMode, setViewMode] = useState("calendar");
        const [dashboardYear, setDashboardYear] = useState(2026);

        // Modal Form State
        const [formType, setFormType] = useState("expense");
        const [timeOfDay, setTimeOfDay] = useState("morning");
        const [amount, setAmount] = useState("");
        const [note, setNote] = useState("");
        const fileInputRef = useRef(null);

        // Tự động lưu trữ khi có thay đổi dữ liệu
        useEffect(() => {
          localStorage.setItem(
            "finance_data_pro",
            JSON.stringify(transactions)
          );
        }, [transactions]);

        const currentYear = currentDate.getFullYear();
        const currentMonth = currentDate.getMonth();
        const daysInMonth = new Date(
          currentYear,
          currentMonth + 1,
          0
        ).getDate();
        const firstDayOfMonth = new Date(currentYear, currentMonth, 1).getDay();
        const startingDay = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1;

        const monthNames = [
          "Tháng 1",
          "Tháng 2",
          "Tháng 3",
          "Tháng 4",
          "Tháng 5",
          "Tháng 6",
          "Tháng 7",
          "Tháng 8",
          "Tháng 9",
          "Tháng 10",
          "Tháng 11",
          "Tháng 12",
        ];
        const dayNames = [
          "Thứ hai",
          "Thứ ba",
          "Thứ tư",
          "Thứ năm",
          "Thứ sáu",
          "Thứ bảy",
          "Chủ nhật",
        ];

        const prevMonth = () =>
          setCurrentDate(new Date(currentYear, currentMonth - 1, 1));
        const nextMonth = () =>
          setCurrentDate(new Date(currentYear, currentMonth + 1, 1));

        const getDateKey = (year, month, day) => {
          const padMonth = String(month + 1).padStart(2, "0");
          const padDay = String(day).padStart(2, "0");
          return `${year}-${padMonth}-${padDay}`;
        };

        const formatCurrency = (value) => {
          return new Intl.NumberFormat("vi-VN", {
            style: "currency",
            currency: "VND",
          }).format(value);
        };

        const monthlySummary = useMemo(() => {
          let totalIncome = 0;
          let totalExpense = 0;
          for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = getDateKey(currentYear, currentMonth, day);
            const dayData = transactions[dateKey];
            if (dayData) {
              if (dayData.incomes)
                dayData.incomes.forEach((inc) => (totalIncome += inc.amount));
              if (dayData.expenses)
                dayData.expenses.forEach((exp) => (totalExpense += exp.amount));
            }
          }
          return {
            totalIncome,
            totalExpense,
            netSavings: totalIncome - totalExpense,
          };
        }, [transactions, currentYear, currentMonth, daysInMonth]);

        const yearlyDashboardData = useMemo(() => {
          let yearTotalIncome = 0;
          let yearTotalExpense = 0;
          const monthsData = Array(12)
            .fill(0)
            .map(() => ({ income: 0, expense: 0, net: 0 }));

          Object.entries(transactions).forEach(([dateStr, data]) => {
            const [yearStr, monthStr] = dateStr.split("-");
            const year = parseInt(yearStr);
            const monthIndex = parseInt(monthStr) - 1;

            if (year === dashboardYear) {
              let dayIncome = 0;
              let dayExpense = 0;
              if (data.incomes)
                data.incomes.forEach((inc) => (dayIncome += inc.amount));
              if (data.expenses)
                data.expenses.forEach((exp) => (dayExpense += exp.amount));
              monthsData[monthIndex].income += dayIncome;
              monthsData[monthIndex].expense += dayExpense;
              monthsData[monthIndex].net += dayIncome - dayExpense;
              yearTotalIncome += dayIncome;
              yearTotalExpense += dayExpense;
            }
          });

          return {
            totalIncome: yearTotalIncome,
            totalExpense: yearTotalExpense,
            netSavings: yearTotalIncome - yearTotalExpense,
            monthsData,
          };
        }, [transactions, dashboardYear]);

        const maxMonthlyValue = useMemo(() => {
          let max = 0;
          yearlyDashboardData.monthsData.forEach((m) => {
            if (m.income > max) max = m.income;
            if (m.expense > max) max = m.expense;
          });
          return max || 1;
        }, [yearlyDashboardData]);

        const openModal = (
          dateKey,
          defaultFormType = "expense",
          defaultTime = "morning"
        ) => {
          setSelectedDateKey(dateKey);
          setFormType(defaultFormType);
          setTimeOfDay(defaultTime);
          setAmount("");
          setNote("");
          setIsModalOpen(true);
        };

        const closeModal = () => {
          setIsModalOpen(false);
          setSelectedDateKey(null);
        };

        const handleSaveTransaction = (e) => {
          e.preventDefault();
          if (!amount || isNaN(amount) || Number(amount) <= 0) {
            alert("Vui lòng nhập số tiền hợp lệ.");
            return;
          }
          const newTransaction = {
            id: Date.now().toString(),
            amount: Number(amount),
            note: note.trim() || "Không có ghi chú",
          };
          setTransactions((prev) => {
            const updated = { ...prev };
            if (!updated[selectedDateKey])
              updated[selectedDateKey] = { expenses: [], incomes: [] };
            if (formType === "income") {
              updated[selectedDateKey].incomes.push(newTransaction);
            } else {
              newTransaction.timeOfDay = timeOfDay;
              updated[selectedDateKey].expenses.push(newTransaction);
            }
            return updated;
          });
          closeModal();
        };

        const handleDeleteTransaction = (dateKey, type, id) => {
          setTransactions((prev) => {
            const updated = { ...prev };
            if (type === "income") {
              updated[dateKey].incomes = updated[dateKey].incomes.filter(
                (t) => t.id !== id
              );
            } else {
              updated[dateKey].expenses = updated[dateKey].expenses.filter(
                (t) => t.id !== id
              );
            }
            return updated;
          });
        };

        const handleExportData = () => {
          const dataStr = JSON.stringify(transactions);
          const dataUri =
            "data:application/json;charset=utf-8," +
            encodeURIComponent(dataStr);
          const exportFileDefaultName = `Dulieu_TaiChinh_${new Date()
            .toLocaleDateString("vi-VN")
            .replace(/\//g, "-")}.json`;
          const linkElement = document.createElement("a");
          linkElement.setAttribute("href", dataUri);
          linkElement.setAttribute("download", exportFileDefaultName);
          linkElement.click();
        };

        const handleImportData = (event) => {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            try {
              const importedData = JSON.parse(e.target.result);
              setTransactions(importedData);
              alert("Đã phục hồi dữ liệu thành công!");
            } catch (error) {
              alert("Lỗi file dữ liệu. Vui lòng chọn đúng file .json đã lưu.");
            }
          };
          reader.readAsText(file);
          event.target.value = "";
        };

        const renderCalendarView = () => {
          const calendarCells = [];
          for (let i = 0; i < startingDay; i++) {
            calendarCells.push(
              <div
                key={`empty-${i}`}
                className="p-2 border border-slate-200 bg-slate-50 min-h-[140px] opacity-50"
              ></div>
            );
          }

          for (let day = 1; day <= daysInMonth; day++) {
            const dateKey = getDateKey(currentYear, currentMonth, day);
            const dayData = transactions[dateKey] || {
              expenses: [],
              incomes: [],
            };

            const morningExpenses = dayData.expenses.filter(
              (e) => e.timeOfDay === "morning"
            );
            const afternoonExpenses = dayData.expenses.filter(
              (e) => e.timeOfDay === "afternoon"
            );

            const sumMorning = morningExpenses.reduce(
              (sum, e) => sum + e.amount,
              0
            );
            const sumAfternoon = afternoonExpenses.reduce(
              (sum, e) => sum + e.amount,
              0
            );
            const sumIncome = dayData.incomes.reduce(
              (sum, i) => sum + i.amount,
              0
            );
            const sumTotalExpense = sumMorning + sumAfternoon;

            const isToday =
              new Date().toDateString() ===
              new Date(currentYear, currentMonth, day).toDateString();

            let cellBg = "bg-white";
            if (isToday) cellBg = "bg-green-50 ring-2 ring-green-400 inset-0";
            else if ((startingDay + day - 1) % 7 >= 5) cellBg = "bg-red-50";

            calendarCells.push(
              <div
                key={dateKey}
                className={`relative border border-slate-200 min-h-[160px] flex flex-col group ${cellBg} hover:shadow-md transition-shadow`}
              >
                <div className="flex justify-between items-start p-2 border-b border-slate-100">
                  <span
                    className={`text-xl font-bold ${
                      (startingDay + day - 1) % 7 >= 5
                        ? "text-red-500"
                        : "text-slate-700"
                    }`}
                  >
                    {String(day).padStart(2, "0")}
                  </span>
                  {sumTotalExpense > 0 && (
                    <span className="text-xs font-semibold text-rose-500 bg-rose-100 px-2 py-1 rounded-full">
                      -{formatCurrency(sumTotalExpense)}
                    </span>
                  )}
                </div>

                <div className="flex-1 flex flex-col p-1 gap-1 text-xs">
                  {sumIncome > 0 && (
                    <div
                      onClick={() => openModal(dateKey, "income")}
                      className="bg-emerald-100 text-emerald-700 p-1 rounded cursor-pointer hover:bg-emerald-200 transition-colors border border-emerald-200 text-center font-medium truncate"
                      title="Thu nhập"
                    >
                      +{formatCurrency(sumIncome)}
                    </div>
                  )}
                  <div
                    onClick={() => openModal(dateKey, "expense", "morning")}
                    className={`flex-1 rounded p-1 cursor-pointer transition-colors border flex flex-col justify-between ${
                      sumMorning > 0
                        ? "bg-amber-50 border-amber-200"
                        : "bg-slate-50 border-dashed border-slate-200 hover:bg-slate-100"
                    }`}
                  >
                    <div className="text-slate-400 font-medium flex justify-between">
                      <span>Sáng</span>
                      {sumMorning === 0 && (
                        <span className="opacity-0 group-hover:opacity-100 text-slate-300">
                          <IconPlus size={12} />
                        </span>
                      )}
                    </div>
                    {sumMorning > 0 && (
                      <div className="text-rose-600 font-semibold text-right">
                        {formatCurrency(sumMorning)}
                      </div>
                    )}
                  </div>
                  <div
                    onClick={() => openModal(dateKey, "expense", "afternoon")}
                    className={`flex-1 rounded p-1 cursor-pointer transition-colors border flex flex-col justify-between ${
                      sumAfternoon > 0
                        ? "bg-orange-50 border-orange-200"
                        : "bg-slate-50 border-dashed border-slate-200 hover:bg-slate-100"
                    }`}
                  >
                    <div className="text-slate-400 font-medium flex justify-between">
                      <span>Chiều/Tối</span>
                      {sumAfternoon === 0 && (
                        <span className="opacity-0 group-hover:opacity-100 text-slate-300">
                          <IconPlus size={12} />
                        </span>
                      )}
                    </div>
                    {sumAfternoon > 0 && (
                      <div className="text-rose-600 font-semibold text-right">
                        {formatCurrency(sumAfternoon)}
                      </div>
                    )}
                  </div>
                </div>

                <div className="absolute top-1 right-1 opacity-0 group-hover:opacity-100 transition-opacity flex gap-1">
                  <button
                    onClick={(e) => {
                      e.stopPropagation();
                      openModal(dateKey, "income");
                    }}
                    className="bg-emerald-500 text-white p-1 rounded hover:bg-emerald-600"
                    title="Thêm Thu Nhập"
                  >
                    <IconTrendingUp size={14} />
                  </button>
                </div>
              </div>
            );
          }

          return (
            <>
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden mb-6">
                <div className="bg-emerald-600 text-white p-4 flex flex-col md:flex-row items-center justify-between gap-4">
                  <div className="flex items-center gap-4 border border-emerald-400 rounded-lg p-1 bg-emerald-700/50">
                    <button
                      onClick={prevMonth}
                      className="p-2 hover:bg-emerald-500 rounded transition-colors"
                    >
                      <IconChevronLeft />
                    </button>
                    <div className="text-xl font-bold uppercase tracking-wide min-w-[180px] text-center font-title">
                      {monthNames[currentMonth]} - {currentYear}
                    </div>
                    <button
                      onClick={nextMonth}
                      className="p-2 hover:bg-emerald-500 rounded transition-colors"
                    >
                      <IconChevronRight />
                    </button>
                  </div>
                  <div className="flex flex-wrap items-center justify-center gap-3">
                    <input
                      type="file"
                      accept=".json"
                      style={{ display: "none" }}
                      ref={fileInputRef}
                      onChange={handleImportData}
                    />
                    <button
                      onClick={() => fileInputRef.current.click()}
                      className="text-emerald-100 hover:text-white flex items-center gap-1.5 text-sm bg-emerald-700/50 px-3 py-1.5 rounded-lg transition-colors"
                      title="Phục hồi dữ liệu"
                    >
                      <IconUpload /> Nhập file
                    </button>
                    <button
                      onClick={handleExportData}
                      className="text-emerald-100 hover:text-white flex items-center gap-1.5 text-sm bg-emerald-700/50 px-3 py-1.5 rounded-lg transition-colors"
                      title="Lưu file về máy"
                    >
                      <IconDownload /> Sao lưu
                    </button>
                    <button
                      onClick={() => {
                        setDashboardYear(currentYear);
                        setViewMode("yearlyDashboard");
                      }}
                      className="bg-white text-emerald-700 hover:bg-emerald-50 px-4 py-2 rounded-xl font-bold flex items-center gap-2 transition-colors shadow-sm ml-2 font-title"
                    >
                      <IconBarChart /> Dashboard Năm
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x divide-slate-100 bg-white">
                  <div className="p-6 flex items-center gap-4">
                    <div className="bg-emerald-100 p-3 rounded-full text-emerald-600">
                      <IconTrendingUp />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-500 mb-1">
                        Tổng Thu (Tháng này)
                      </p>
                      <p className="text-2xl font-bold text-slate-800 font-title">
                        {formatCurrency(monthlySummary.totalIncome)}
                      </p>
                    </div>
                  </div>
                  <div className="p-6 flex items-center gap-4">
                    <div className="bg-rose-100 p-3 rounded-full text-rose-600">
                      <IconTrendingDown />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-500 mb-1">
                        Tổng Chi (Tháng này)
                      </p>
                      <p className="text-2xl font-bold text-slate-800 font-title">
                        {formatCurrency(monthlySummary.totalExpense)}
                      </p>
                    </div>
                  </div>
                  <div className="p-6 flex items-center gap-4 bg-slate-50">
                    <div className="bg-blue-100 p-3 rounded-full text-blue-600">
                      <IconPiggyBank />
                    </div>
                    <div>
                      <p className="text-sm font-medium text-slate-500 mb-1">
                        Tích Lũy (Tháng này)
                      </p>
                      <p
                        className={`text-2xl font-bold font-title ${
                          monthlySummary.netSavings >= 0
                            ? "text-blue-600"
                            : "text-rose-600"
                        }`}
                      >
                        {formatCurrency(monthlySummary.netSavings)}
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="grid grid-cols-7 border-b border-slate-200">
                  {dayNames.map((day, index) => (
                    <div
                      key={day}
                      className={`p-4 text-center font-semibold text-sm hidden sm:block ${
                        index >= 5
                          ? "text-red-500 bg-red-50/30"
                          : "text-slate-600"
                      }`}
                    >
                      {day}
                    </div>
                  ))}
                  {["T2", "T3", "T4", "T5", "T6", "T7", "CN"].map(
                    (day, index) => (
                      <div
                        key={`mob-${day}`}
                        className={`p-2 text-center font-semibold text-xs sm:hidden ${
                          index >= 5
                            ? "text-red-500 bg-red-50/30"
                            : "text-slate-600"
                        }`}
                      >
                        {day}
                      </div>
                    )
                  )}
                </div>
                <div className="grid grid-cols-7 bg-slate-200 gap-px">
                  {calendarCells}
                </div>
              </div>

              <div className="text-center text-sm text-slate-500 mt-4 flex items-center justify-center gap-2 mb-8">
                <IconInfo /> Dữ liệu của bạn được tự động lưu vào trình duyệt
                thiết bị này.
              </div>
            </>
          );
        };

        const renderYearlyDashboard = () => {
          return (
            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden min-h-[600px] flex flex-col mb-8">
              <div className="bg-slate-800 text-white p-4 flex flex-wrap gap-4 items-center justify-between">
                <div className="flex items-center gap-4">
                  <button
                    onClick={() => setViewMode("calendar")}
                    className="p-2 bg-slate-700 hover:bg-slate-600 rounded-lg transition-colors flex items-center gap-2"
                  >
                    <IconArrowLeft />
                    <span className="hidden sm:inline font-medium font-title">
                      Trở về Lịch
                    </span>
                  </button>
                  <h2 className="text-xl font-bold font-title">Báo Cáo Năm</h2>
                </div>
                <div className="flex items-center gap-4 border border-slate-600 rounded-lg p-1 bg-slate-900/50">
                  <button
                    onClick={() => setDashboardYear((y) => y - 1)}
                    className="p-2 hover:bg-slate-700 rounded transition-colors"
                  >
                    <IconChevronLeft />
                  </button>
                  <div className="text-lg font-bold w-24 text-center text-emerald-400 font-title">
                    {dashboardYear}
                  </div>
                  <button
                    onClick={() => setDashboardYear((y) => y + 1)}
                    className="p-2 hover:bg-slate-700 rounded transition-colors"
                  >
                    <IconChevronRight />
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 divide-y md:divide-y-0 md:divide-x border-b border-slate-200">
                <div className="p-6 flex flex-col items-center text-center bg-emerald-50/50">
                  <p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">
                    Tổng Thu Nhập Năm {dashboardYear}
                  </p>
                  <p className="text-3xl font-black text-emerald-600 font-title">
                    {formatCurrency(yearlyDashboardData.totalIncome)}
                  </p>
                </div>
                <div className="p-6 flex flex-col items-center text-center bg-rose-50/50">
                  <p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">
                    Tổng Chi Tiêu Năm {dashboardYear}
                  </p>
                  <p className="text-3xl font-black text-rose-600 font-title">
                    {formatCurrency(yearlyDashboardData.totalExpense)}
                  </p>
                </div>
                <div className="p-6 flex flex-col items-center text-center bg-blue-50/50">
                  <p className="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">
                    Số Dư Tích Lũy Năm {dashboardYear}
                  </p>
                  <p
                    className={`text-4xl font-black font-title ${
                      yearlyDashboardData.netSavings >= 0
                        ? "text-blue-600"
                        : "text-rose-600"
                    }`}
                  >
                    {formatCurrency(yearlyDashboardData.netSavings)}
                  </p>
                </div>
              </div>

              <div className="p-6 flex-1 bg-slate-50 overflow-x-auto">
                <h3 className="text-lg font-bold text-slate-800 mb-6 flex items-center gap-2 font-title">
                  <IconBarChart /> Chi Tiết Từng Tháng
                </h3>
                <div className="space-y-4 min-w-[700px] mx-auto">
                  <div className="grid grid-cols-12 gap-4 px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
                    <div className="col-span-2">Tháng</div>
                    <div className="col-span-3 text-right">Thu Nhập</div>
                    <div className="col-span-3 text-right">Chi Tiêu</div>
                    <div className="col-span-4 pl-4 border-l border-slate-200">
                      Biểu đồ trực quan
                    </div>
                  </div>
                  {yearlyDashboardData.monthsData.map((data, index) => {
                    const incWidth =
                      maxMonthlyValue > 0
                        ? (data.income / maxMonthlyValue) * 100
                        : 0;
                    const expWidth =
                      maxMonthlyValue > 0
                        ? (data.expense / maxMonthlyValue) * 100
                        : 0;
                    const hasData = data.income > 0 || data.expense > 0;
                    return (
                      <div
                        key={`month-${index}`}
                        className={`grid grid-cols-12 gap-4 items-center p-4 rounded-lg bg-white border border-slate-100 shadow-sm ${
                          !hasData && "opacity-50 grayscale"
                        }`}
                      >
                        <div className="col-span-2 font-bold text-slate-700">
                          Tháng {index + 1}
                        </div>
                        <div className="col-span-3 text-right font-medium text-emerald-600">
                          {formatCurrency(data.income)}
                        </div>
                        <div className="col-span-3 text-right font-medium text-rose-500">
                          {formatCurrency(data.expense)}
                        </div>
                        <div className="col-span-4 pl-4 border-l border-slate-100 flex flex-col justify-center gap-1.5 h-full">
                          {hasData ? (
                            <>
                              <div className="w-full bg-slate-100 rounded-full h-2">
                                <div
                                  className="bg-emerald-400 h-2 rounded-full"
                                  style={{ width: `${incWidth}%` }}
                                ></div>
                              </div>
                              <div className="w-full bg-slate-100 rounded-full h-2">
                                <div
                                  className="bg-rose-400 h-2 rounded-full"
                                  style={{ width: `${expWidth}%` }}
                                ></div>
                              </div>
                              <div
                                className={`text-[10px] font-bold mt-1 text-right ${
                                  data.net >= 0
                                    ? "text-blue-500"
                                    : "text-rose-500"
                                }`}
                              >
                                Dư: {formatCurrency(data.net)}
                              </div>
                            </>
                          ) : (
                            <div className="text-xs text-slate-400 italic">
                              Chưa có dữ liệu
                            </div>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          );
        };

        return (
          <div className="min-h-screen bg-slate-100 p-2 md:p-8">
            <div className="max-w-7xl mx-auto">
              {viewMode === "calendar"
                ? renderCalendarView()
                : renderYearlyDashboard()}
            </div>

            {isModalOpen && (
              <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                <div className="bg-white rounded-2xl shadow-xl w-full max-w-md overflow-hidden flex flex-col max-h-[90vh]">
                  <div
                    className={`p-4 text-white flex justify-between items-center ${
                      formType === "income" ? "bg-emerald-600" : "bg-rose-600"
                    }`}
                  >
                    <h3 className="font-bold text-lg flex items-center gap-2 font-title">
                      {formType === "income" ? (
                        <IconTrendingUp size={20} />
                      ) : (
                        <IconTrendingDown size={20} />
                      )}
                      {formType === "income"
                        ? "Thêm Thu Nhập"
                        : "Ghi Nhận Chi Tiêu"}
                      <span className="font-normal text-sm opacity-80 ml-2">
                        ({selectedDateKey.split("-").reverse().join("/")})
                      </span>
                    </h3>
                    <button
                      onClick={closeModal}
                      className="p-1 hover:bg-white/20 rounded-full transition-colors"
                    >
                      <IconX />
                    </button>
                  </div>
                  <div className="p-6 overflow-y-auto">
                    <form
                      onSubmit={handleSaveTransaction}
                      className="space-y-4 mb-8"
                    >
                      {formType === "expense" && (
                        <div>
                          <label className="block text-sm font-medium text-slate-700 mb-2">
                            Thời điểm
                          </label>
                          <div className="grid grid-cols-2 gap-2">
                            <button
                              type="button"
                              onClick={() => setTimeOfDay("morning")}
                              className={`p-2 rounded-lg border font-medium transition-colors ${
                                timeOfDay === "morning"
                                  ? "bg-amber-100 border-amber-300 text-amber-800"
                                  : "bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100"
                              }`}
                            >
                              Sáng (AM)
                            </button>
                            <button
                              type="button"
                              onClick={() => setTimeOfDay("afternoon")}
                              className={`p-2 rounded-lg border font-medium transition-colors ${
                                timeOfDay === "afternoon"
                                  ? "bg-orange-100 border-orange-300 text-orange-800"
                                  : "bg-slate-50 border-slate-200 text-slate-500 hover:bg-slate-100"
                              }`}
                            >
                              Chiều/Tối (PM)
                            </button>
                          </div>
                        </div>
                      )}
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Số tiền (VNĐ)
                        </label>
                        <input
                          type="number"
                          value={amount}
                          onChange={(e) => setAmount(e.target.value)}
                          placeholder="Ví dụ: 150000"
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all font-mono text-lg"
                          autoFocus
                        />
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-slate-700 mb-1">
                          Ghi chú hoạt động
                        </label>
                        <input
                          type="text"
                          value={note}
                          onChange={(e) => setNote(e.target.value)}
                          placeholder="Ăn sáng, Đổ xăng, Mua đồ..."
                          className="w-full p-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition-all"
                        />
                      </div>
                      <button
                        type="submit"
                        className={`w-full py-3 rounded-lg text-white font-bold text-lg shadow-md hover:shadow-lg transition-all ${
                          formType === "income"
                            ? "bg-emerald-600 hover:bg-emerald-700"
                            : "bg-rose-600 hover:bg-rose-700"
                        }`}
                      >
                        Lưu Giao Dịch
                      </button>
                    </form>
                    <div className="border-t border-slate-200 pt-6">
                      <h4 className="font-semibold text-slate-800 mb-4 font-title">
                        Giao dịch trong ngày:
                      </h4>
                      {!transactions[selectedDateKey] ||
                      (transactions[selectedDateKey].incomes.length === 0 &&
                        transactions[selectedDateKey].expenses.length === 0) ? (
                        <p className="text-slate-500 text-sm italic text-center p-4 bg-slate-50 rounded-lg">
                          Chưa có giao dịch nào.
                        </p>
                      ) : (
                        <div className="space-y-3">
                          {transactions[selectedDateKey]?.incomes.map((inc) => (
                            <div
                              key={inc.id}
                              className="flex items-center justify-between p-3 bg-emerald-50 border border-emerald-100 rounded-lg"
                            >
                              <div>
                                <p className="font-medium text-emerald-800 text-sm">
                                  +{formatCurrency(inc.amount)}
                                </p>
                                <p className="text-xs text-emerald-600 mt-1">
                                  {inc.note}
                                </p>
                              </div>
                              <button
                                onClick={() =>
                                  handleDeleteTransaction(
                                    selectedDateKey,
                                    "income",
                                    inc.id
                                  )
                                }
                                className="text-emerald-400 hover:text-emerald-700 p-1"
                              >
                                <IconX size={16} />
                              </button>
                            </div>
                          ))}
                          {transactions[selectedDateKey]?.expenses.map(
                            (exp) => (
                              <div
                                key={exp.id}
                                className="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-lg"
                              >
                                <div>
                                  <div className="flex items-center gap-2">
                                    <span
                                      className={`text-[10px] uppercase font-bold px-2 py-0.5 rounded text-white ${
                                        exp.timeOfDay === "morning"
                                          ? "bg-amber-500"
                                          : "bg-orange-500"
                                      }`}
                                    >
                                      {exp.timeOfDay === "morning"
                                        ? "Sáng"
                                        : "Chiều"}
                                    </span>
                                    <p className="font-medium text-rose-600 text-sm">
                                      -{formatCurrency(exp.amount)}
                                    </p>
                                  </div>
                                  <p className="text-xs text-slate-500 mt-1">
                                    {exp.note}
                                  </p>
                                </div>
                                <button
                                  onClick={() =>
                                    handleDeleteTransaction(
                                      selectedDateKey,
                                      "expense",
                                      exp.id
                                    )
                                  }
                                  className="text-slate-400 hover:text-rose-500 p-1"
                                >
                                  <IconX size={16} />
                                </button>
                              </div>
                            )
                          )}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
